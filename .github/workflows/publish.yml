name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_npm:
        description: Publish every npm package version that is not yet in the registry
        type: boolean
        required: false
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      any_npm: ${{ steps.check.outputs.any_npm }}
      protocol: ${{ steps.check.outputs.protocol }}
      client: ${{ steps.check.outputs.client }}
      angular: ${{ steps.check.outputs.angular }}
      react: ${{ steps.check.outputs.react }}
      nest: ${{ steps.check.outputs.nest }}
      express: ${{ steps.check.outputs.express }}
      spring: ${{ steps.check.outputs.spring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect per-package changes since previous tag
        id: check
        run: |
          if [ "${{ inputs.force_npm }}" = "true" ]; then
            PROTOCOL=true
            CLIENT=true
            ANGULAR=true
            REACT=true
            NEST=true
            EXPRESS=true
            SPRING=false
          else
            PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
            changed() {
              [ -z "$PREV" ] && echo true && return
              [ -n "$(git diff --name-only "$PREV" HEAD -- "$1")" ] && echo true || echo false
            }
            PROTOCOL=$(changed packages/protocol)
            CLIENT=$(changed packages/client)
            ANGULAR=$(changed packages/angular)
            REACT=$(changed packages/react)
            NEST=$(changed packages/nest)
            EXPRESS=$(changed packages/express)
            SPRING=$(changed packages/spring)
          fi
          if [ "$PROTOCOL" = true ] || [ "$CLIENT" = true ] || [ "$ANGULAR" = true ] || \
             [ "$REACT" = true ]    || [ "$NEST" = true ]   || [ "$EXPRESS" = true ]; then
            ANY_NPM=true
          else
            ANY_NPM=false
          fi
          echo "protocol=$PROTOCOL"   >> "$GITHUB_OUTPUT"
          echo "client=$CLIENT"       >> "$GITHUB_OUTPUT"
          echo "angular=$ANGULAR"     >> "$GITHUB_OUTPUT"
          echo "react=$REACT"         >> "$GITHUB_OUTPUT"
          echo "nest=$NEST"           >> "$GITHUB_OUTPUT"
          echo "express=$EXPRESS"     >> "$GITHUB_OUTPUT"
          echo "spring=$SPRING"       >> "$GITHUB_OUTPUT"
          echo "any_npm=$ANY_NPM"     >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test:pack
      - if: needs.detect-changes.outputs.protocol == 'true'
        run: node scripts/publish-npm-package.mjs packages/protocol
      - if: needs.detect-changes.outputs.client == 'true'
        run: node scripts/publish-npm-package.mjs packages/client
      - if: needs.detect-changes.outputs.angular == 'true'
        run: node scripts/publish-npm-package.mjs packages/angular
      - if: needs.detect-changes.outputs.react == 'true'
        run: node scripts/publish-npm-package.mjs packages/react
      - if: needs.detect-changes.outputs.nest == 'true'
        run: node scripts/publish-npm-package.mjs packages/nest
      - if: needs.detect-changes.outputs.express == 'true'
        run: node scripts/publish-npm-package.mjs packages/express

  publish-spring:
    needs: detect-changes
    if: needs.detect-changes.outputs.spring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew publish
        working-directory: packages/spring
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
