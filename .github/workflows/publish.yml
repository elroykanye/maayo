name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      spring: ${{ steps.check.outputs.spring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check spring changes since previous tag
        id: check
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          if [ -z "$PREV" ]; then
            echo "spring=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$PREV" HEAD -- packages/spring)
            echo "spring=$( [ -n "$CHANGED" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - run: pnpm --filter @maayo/protocol publish --access public --no-git-checks
      - run: pnpm --filter @maayo/client publish --access public --no-git-checks
      - run: pnpm --filter @maayo/angular publish --access public --no-git-checks
      - run: pnpm --filter @maayo/react publish --access public --no-git-checks
      - run: pnpm --filter @maayo/nest publish --access public --no-git-checks
      - run: pnpm --filter @maayo/express publish --access public --no-git-checks
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-spring:
    needs: detect-changes
    if: needs.detect-changes.outputs.spring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew publish
        working-directory: packages/spring
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
